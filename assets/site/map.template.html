<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123f34">
  <title>__PAGE_TITLE__ · 路线地图</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --ink: #18332a;
      --muted: #627069;
      --green: #0c5b48;
      --paper: #f5f2e9;
      --line: #d9ded8;
      --white: #fff;
      --shadow: 0 14px 42px rgba(22, 45, 36, .14);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, a { -webkit-tap-highlight-color: transparent; }
    .topbar {
      height: 68px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      background: linear-gradient(115deg, #0d493b, #123f34);
    }
    .brand {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 14px;
      background: rgba(255,255,255,.08);
      font-size: 22px;
    }
    .title-wrap { min-width: 0; }
    .title-wrap h1 { margin: 0; overflow: hidden; font-size: 17px; text-overflow: ellipsis; white-space: nowrap; }
    .title-wrap p { margin: 4px 0 0; color: rgba(255,255,255,.72); font-size: 10px; }
    .guide-link {
      min-height: 40px;
      margin-left: auto;
      padding: 0 13px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 12px;
      color: #fff;
      background: rgba(255,255,255,.09);
      font-size: 11px;
      font-weight: 800;
      text-decoration: none;
    }
    .app { height: calc(100% - 68px); display: grid; grid-template-columns: minmax(370px, 430px) 1fr; }
    .panel { min-width: 0; overflow-y: auto; border-right: 1px solid var(--line); background: var(--paper); }
    .intro { padding: 20px 20px 14px; }
    .eyebrow {
      margin: 0 0 6px;
      color: var(--green);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .intro h2 { margin: 0; font-size: 21px; line-height: 1.25; }
    .intro-copy { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .facts { margin-top: 13px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .fact { min-width: 0; padding: 10px 11px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.72); }
    .fact span { display: block; color: var(--muted); font-size: 9px; }
    .fact strong { display: block; margin-top: 4px; overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .day-nav {
      position: sticky;
      z-index: 20;
      top: 0;
      padding: 10px 16px;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      border-block: 1px solid var(--line);
      background: rgba(245,242,233,.94);
      backdrop-filter: blur(12px);
      scrollbar-width: none;
    }
    .day-nav::-webkit-scrollbar { display: none; }
    .day-button {
      min-width: 48px;
      min-height: 38px;
      padding: 0 12px;
      flex: 0 0 auto;
      border: 1px solid #d4dad5;
      border-radius: 11px;
      color: #4e5c55;
      background: #fff;
      font: inherit;
      font-size: 10px;
      font-weight: 850;
      cursor: pointer;
    }
    .day-button.active { color: #fff; border-color: var(--green); background: var(--green); }
    #detail { padding: 16px 20px 28px; }
    .heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .heading h3 { margin: 0; font-size: 18px; line-height: 1.3; }
    .day-code { min-width: 44px; height: 44px; display: grid; place-items: center; border-radius: 13px; color: #fff; font-size: 11px; font-weight: 900; }
    .summary { margin: 9px 0 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .metric-grid { margin-top: 13px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .metric { padding: 10px 11px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
    .metric span { display: block; color: var(--muted); font-size: 9px; }
    .metric strong { display: block; margin-top: 4px; font-size: 11px; line-height: 1.4; }
    .section-label { margin: 17px 0 8px; color: #43564e; font-size: 10px; font-weight: 900; }
    .timeline { display: grid; gap: 7px; }
    .stop {
      padding: 10px;
      display: grid;
      grid-template-columns: 29px 1fr auto;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
    }
    .stop-num { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 9px; color: #fff; font-size: 9px; font-weight: 900; }
    .stop-name { min-width: 0; }
    .stop-name strong, .stop-name span { display: block; }
    .stop-name strong { font-size: 11px; }
    .stop-name span { margin-top: 2px; overflow: hidden; color: var(--muted); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .stop-flags { display: flex; gap: 4px; font-size: 14px; }
    .booking, .risk {
      margin-top: 12px;
      padding: 11px 12px;
      border: 1px solid #edcf94;
      border-radius: 12px;
      color: #7b5314;
      background: #fff5db;
      font-size: 10px;
      line-height: 1.55;
    }
    .risk { border-color: #d3dfd8; color: #415a4f; background: #eef5f1; }
    .map-wrap { position: relative; min-width: 0; background: #d8e3dc; }
    #map { width: 100%; height: 100%; }
    .map-tools { position: absolute; z-index: 500; top: 14px; right: 14px; display: flex; gap: 7px; }
    .map-tools button {
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(24,51,42,.14);
      border-radius: 11px;
      color: var(--ink);
      background: rgba(255,255,255,.94);
      box-shadow: 0 8px 22px rgba(24,51,42,.13);
      font: inherit;
      font-size: 10px;
      font-weight: 850;
      cursor: pointer;
    }
    .legend {
      position: absolute;
      z-index: 500;
      right: 14px;
      bottom: 24px;
      padding: 10px 12px;
      border: 1px solid rgba(24,51,42,.14);
      border-radius: 12px;
      color: #415149;
      background: rgba(255,255,255,.92);
      box-shadow: var(--shadow);
      font-size: 9px;
      line-height: 1.6;
      backdrop-filter: blur(10px);
    }
    .legend div + div { margin-top: 3px; }
    .route-pin {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 3px solid #fff;
      border-radius: 50% 50% 50% 12%;
      color: #fff;
      transform: rotate(-45deg);
      box-shadow: 0 5px 13px rgba(18,35,28,.28);
      font-size: 9px;
      font-weight: 900;
    }
    .route-pin span { transform: rotate(45deg); }
    .emoji-pin {
      position: relative;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 3px solid #fff;
      border-radius: 14px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 5px 15px rgba(18,35,28,.28), 0 0 0 3px var(--marker);
      font-size: 20px;
    }
    .order, .ticket {
      position: absolute;
      display: grid;
      place-items: center;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 2px 7px rgba(18,35,28,.22);
    }
    .order { top: -8px; left: -8px; width: 18px; height: 18px; color: #fff; background: var(--marker); font-size: 8px; font-weight: 900; }
    .ticket { right: -9px; bottom: -8px; width: 21px; height: 21px; background: #fff3ce; font-size: 11px; font-style: normal; }
    .day-label { width: max-content; padding: 4px 7px; border: 2px solid #fff; border-radius: 7px; color: #fff; box-shadow: 0 2px 8px rgba(20,38,30,.2); font-size: 8px; font-weight: 900; transform: translate(-50%,-50%); }
    .leaflet-container { font: inherit; }
    .leaflet-popup-content-wrapper { border-radius: 14px; }
    .popup-day { color: var(--green); font-size: 9px; font-weight: 900; }
    .popup-name { margin-top: 4px; font-size: 13px; font-weight: 900; }
    .popup-en { margin-top: 2px; color: var(--muted); font-size: 10px; }
    .popup-note { margin-top: 7px; color: #52615a; font-size: 9px; line-height: 1.5; }
    .popup-booking { margin-top: 7px; padding: 6px 8px; border-radius: 8px; color: #7b5314; background: #fff3d5; font-size: 9px; font-weight: 750; line-height: 1.45; }
    .popup-link { display: inline-block; margin-top: 8px; color: var(--green); font-size: 9px; font-weight: 800; text-decoration: none; }
    @media (max-width: 820px) {
      html, body { height: auto; min-height: 100%; overflow: auto; }
      body { overflow-x: hidden; }
      .topbar { height: 60px; padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right)); }
      .brand { width: 38px; height: 38px; border-radius: 12px; font-size: 19px; }
      .title-wrap h1 { font-size: 15px; }
      .title-wrap p { font-size: 8px; }
      .guide-link { padding-inline: 10px; }
      .app { height: auto; display: flex; flex-direction: column; }
      .map-wrap { order: 1; height: 45svh; min-height: 330px; max-height: 430px; }
      .panel { order: 2; width: 100%; overflow: visible; border: 0; }
      .intro { padding: 17px 14px 12px; }
      .day-nav { padding-inline: 14px; }
      #detail { padding: 15px 14px max(28px, env(safe-area-inset-bottom)); }
      .legend { display: none; }
    }
    @media (max-width: 430px) {
      .intro h2 { font-size: 19px; }
      .facts, .metric-grid { grid-template-columns: 1fr 1fr; }
      .map-tools { top: 10px; right: 10px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-hidden="true">🧭</div>
    <div class="title-wrap">
      <h1 id="topTitle"></h1>
      <p id="topSubtitle"></p>
    </div>
    <a class="guide-link" href="./itinerary.html">完整攻略 →</a>
  </header>
  <main class="app">
    <aside class="panel">
      <section class="intro">
        <p class="eyebrow">Constraint-aware travel plan</p>
        <h2 id="heroTitle"></h2>
        <p class="intro-copy" id="heroCopy"></p>
        <div class="facts" id="facts"></div>
      </section>
      <nav class="day-nav" id="dayNav" aria-label="按天查看"></nav>
      <section id="detail" aria-live="polite"></section>
    </aside>
    <section class="map-wrap" aria-label="旅行路线地图">
      <div id="map"></div>
      <div class="map-tools">
        <button id="overviewButton" type="button">全部路线</button>
        <button id="fitButton" type="button">适合视图</button>
      </div>
      <div class="legend">
        <div>🎟️ 需提前预订 / 确认</div>
        <div>🦘 特色景观 / 亲子地标</div>
        <div>○ 普通停靠点 · 彩色线为每日路线</div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const trip = __ITINERARY_DATA__;
    const esc = (value = "") => String(value).replace(/[&<>"']/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);
    const formatKm = (value) => Number.isFinite(value) ? `${Math.round(value).toLocaleString()} km` : "—";
    const mapsUrl = (stop) => `https://www.google.com/maps/search/?api=1&query=${stop.lat},${stop.lng}`;
    const map = L.map("map", { zoomControl: false, preferCanvas: true, minZoom: 2 });
    L.control.zoom({ position: "bottomleft" }).addTo(map);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    const routeLayer = L.layerGroup().addTo(map);
    const markerLayer = L.layerGroup().addTo(map);
    const labelLayer = L.layerGroup().addTo(map);
    let currentBounds;

    function normalIcon(number, color) {
      return L.divIcon({
        className: "",
        html: `<div class="route-pin" style="background:${color}"><span>${number}</span></div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 30],
        popupAnchor: [0, -27]
      });
    }

    function highlightIcon(stop, number, color) {
      const ticket = stop.bookable ? '<i class="ticket">🎟️</i>' : "";
      return L.divIcon({
        className: "",
        html: `<div class="emoji-pin" style="--marker:${color}">${esc(stop.emoji || "✨")}<b class="order">${number}</b>${ticket}</div>`,
        iconSize: [38, 38],
        iconAnchor: [19, 30],
        popupAnchor: [0, -28]
      });
    }

    function popupHtml(stop, label) {
      const booking = stop.bookable
        ? `<div class="popup-booking">🎟️ ${esc(stop.bookingNote || "需提前预订或确认")}</div>`
        : "";
      return `<div class="popup-day">${esc(label)}</div>
        <div class="popup-name">${esc(stop.name)}</div>
        <div class="popup-en">${esc(stop.en)}</div>
        ${stop.note ? `<div class="popup-note">${esc(stop.note)}</div>` : ""}
        ${booking}
        <a class="popup-link" href="${mapsUrl(stop)}" target="_blank" rel="noreferrer">Google Maps ↗</a>`;
    }

    function clearMap() {
      routeLayer.clearLayers();
      markerLayer.clearLayers();
      labelLayer.clearLayers();
    }

    function pointsFor(day) {
      return Array.isArray(day.geometry) && day.geometry.length > 1
        ? day.geometry
        : day.stops.map((stop) => [stop.lat, stop.lng]);
    }

    function drawDay(day, overview = false) {
      const points = pointsFor(day);
      if (points.length > 1) {
        L.polyline(points, {
          color: day.color,
          weight: overview ? 4 : 6,
          opacity: overview ? .72 : .92
        }).addTo(routeLayer);
      }
      if (overview && points.length) {
        const point = points[Math.floor(points.length / 2)];
        L.marker(point, {
          interactive: false,
          icon: L.divIcon({
            className: "",
            html: `<div class="day-label" style="background:${day.color}">${esc(day.id)}</div>`,
            iconSize: [1, 1]
          })
        }).addTo(labelLayer);
      }
    }

    function addStop(stop, number, color, label) {
      const icon = stop.highlight || stop.emoji || stop.bookable
        ? highlightIcon(stop, number, color)
        : normalIcon(number, color);
      return L.marker([stop.lat, stop.lng], { icon, riseOnHover: true })
        .addTo(markerLayer)
        .bindPopup(popupHtml(stop, label));
    }

    function setActive(id) {
      document.querySelectorAll(".day-button").forEach((button) => {
        button.classList.toggle("active", button.dataset.day === id);
      });
    }

    function fit(bounds, maxZoom = 11) {
      if (!bounds.length) return;
      currentBounds = L.latLngBounds(bounds);
      map.fitBounds(currentBounds, { padding: [48, 48], maxZoom });
    }

    function showOverview() {
      clearMap();
      setActive("overview");
      const bounds = [];
      const seen = new Set();
      trip.days.forEach((day) => {
        drawDay(day, true);
        day.stops.forEach((stop, index) => {
          bounds.push([stop.lat, stop.lng]);
          const key = `${stop.lat}:${stop.lng}:${stop.name}`;
          if (!seen.has(key)) {
            addStop(stop, index + 1, day.color, `${day.id} · ${day.date}`);
            seen.add(key);
          }
        });
      });
      fit(bounds, 8);
      renderOverview();
    }

    function showDay(id) {
      const day = trip.days.find((item) => item.id === id);
      if (!day) return;
      clearMap();
      setActive(id);
      drawDay(day);
      const bounds = [];
      day.stops.forEach((stop, index) => {
        bounds.push([stop.lat, stop.lng]);
        addStop(stop, index + 1, day.color, `${day.id} · 第 ${index + 1} 站`);
      });
      fit(bounds, 12);
      renderDay(day);
    }

    function renderOverview() {
      document.getElementById("detail").innerHTML = `
        <div class="heading">
          <div><p class="eyebrow">Overview</p><h3>${esc(trip.days.length)} 天完整路线</h3></div>
          <div class="day-code" style="background:var(--green)">ALL</div>
        </div>
        <p class="summary">按日期查看每日地点、行驶强度、休息安排和预订提醒。地图上的 🎟️ 表示需提前预订或确认。</p>
        <div class="metric-grid">
          <div class="metric"><span>总距离</span><strong>${formatKm(trip.totalDistanceKm)}</strong></div>
          <div class="metric"><span>旅行强度</span><strong>${esc(trip.pace)}</strong></div>
          <div class="metric"><span>抵达</span><strong>${esc(trip.arrival || "—")}</strong></div>
          <div class="metric"><span>离开</span><strong>${esc(trip.departure || "—")}</strong></div>
        </div>
        <p class="section-label">每日路线</p>
        <div class="timeline">${trip.days.map((day) => `
          <div class="stop" data-day-open="${esc(day.id)}">
            <span class="stop-num" style="background:${day.color}">${esc(day.id)}</span>
            <span class="stop-name"><strong>${esc(day.date)} · ${esc(day.title)}</strong><span>${esc(day.travelTime || "")}</span></span>
            <span class="stop-flags">${day.stops.some((stop) => stop.bookable) ? "🎟️" : ""}</span>
          </div>`).join("")}</div>`;
      document.querySelectorAll("[data-day-open]").forEach((node) => node.addEventListener("click", () => showDay(node.dataset.dayOpen)));
    }

    function renderDay(day) {
      const bookings = day.stops.filter((stop) => stop.bookable);
      document.getElementById("detail").innerHTML = `
        <div class="heading">
          <div><p class="eyebrow">${esc(day.date)} · ${esc(day.theme || "")}</p><h3>${esc(day.title)}</h3></div>
          <div class="day-code" style="background:${day.color}">${esc(day.id)}</div>
        </div>
        <p class="summary">${esc(day.summary)}</p>
        <div class="metric-grid">
          <div class="metric"><span>当天距离</span><strong>${formatKm(day.distanceKm)}</strong></div>
          <div class="metric"><span>交通时间</span><strong>${esc(day.travelTime || "—")}</strong></div>
          <div class="metric"><span>固定休息</span><strong>${esc(day.napPlan || "按体力安排")}</strong></div>
          <div class="metric"><span>住宿</span><strong>${esc(day.stay || "—")}</strong></div>
        </div>
        ${bookings.length ? `<div class="booking"><strong>🎟️ 提前预订：</strong>${bookings.map((stop) => esc(stop.name)).join(" · ")}</div>` : ""}
        <p class="section-label">地点与顺序</p>
        <div class="timeline">${day.stops.map((stop, index) => `
          <div class="stop" data-stop="${index}">
            <span class="stop-num" style="background:${day.color}">${index + 1}</span>
            <span class="stop-name"><strong>${esc(stop.name)}</strong><span>${esc(stop.en)}${stop.travelFromPrevious ? ` · ${esc(stop.travelFromPrevious)}` : ""}</span></span>
            <span class="stop-flags">${stop.optional ? "可删" : ""} ${stop.bookable ? "🎟️" : (stop.emoji || "")}</span>
          </div>`).join("")}</div>
        ${day.risk ? `<div class="risk"><strong>调整与兜底：</strong>${esc(day.risk)}</div>` : ""}`;
      document.querySelectorAll("[data-stop]").forEach((node) => {
        node.addEventListener("click", () => {
          const stop = day.stops[Number(node.dataset.stop)];
          map.flyTo([stop.lat, stop.lng], 14, { duration: .65 });
        });
      });
    }

    document.getElementById("topTitle").textContent = trip.title;
    document.getElementById("topSubtitle").textContent = trip.subtitle || trip.travelWindow;
    document.getElementById("heroTitle").textContent = trip.title;
    document.getElementById("heroCopy").textContent = `${trip.travelWindow} · ${trip.travelers}`;
    document.getElementById("facts").innerHTML = `
      <div class="fact"><span>旅行强度</span><strong>${esc(trip.pace)}</strong></div>
      <div class="fact"><span>固定时间</span><strong>${esc((trip.fixedWindows || []).join(" · ") || "—")}</strong></div>`;
    document.getElementById("dayNav").innerHTML =
      `<button class="day-button active" type="button" data-day="overview">总览</button>` +
      trip.days.map((day) => `<button class="day-button" type="button" data-day="${esc(day.id)}">${esc(day.id)}</button>`).join("");
    document.querySelectorAll(".day-button").forEach((button) => {
      button.addEventListener("click", () => button.dataset.day === "overview" ? showOverview() : showDay(button.dataset.day));
    });
    document.getElementById("overviewButton").addEventListener("click", showOverview);
    document.getElementById("fitButton").addEventListener("click", () => {
      if (currentBounds) map.fitBounds(currentBounds, { padding: [48, 48], maxZoom: 11 });
    });
    showOverview();
    setTimeout(() => map.invalidateSize(), 120);
    window.addEventListener("resize", () => map.invalidateSize());
  </script>
</body>
</html>
